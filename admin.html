<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex,nofollow">
<title>FerrePro Admin</title>
<script src="theme-init.js"></script>
<link rel="stylesheet" href="theme.css"><link rel="stylesheet" href="admin.css">
<script defer src="admin.js"></script>
</head>
<body>
<a class="skip" href="#view">Saltar al contenido</a>
<header class="bar">
  <div class="barInner">
    <a class="brand" href="/admin"><svg viewBox="0 0 32 30" aria-hidden="true"><path d="M2 27 10 3h21l-2 6H15l-1 4h12l-2 6H12l-3 8z" fill="currentColor"/></svg><span>FerrePro</span><span class="tag">Admin</span></a>
    <div class="barActions">
      <a class="ghost" href="/">Ver tienda</a>
      <button class="iconBtn themeToggle" type="button" data-theme-toggle aria-label="Cambiar tema"><svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg><svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
      <button class="ghost" type="button" id="logout" hidden>Cerrar sesión</button>
    </div>
  </div>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Secciones del panel" hidden>
    <button role="tab" id="tab-resumen" data-view="resumen" aria-controls="view">Resumen</button>
    <button role="tab" id="tab-pedidos" data-view="pedidos" aria-controls="view">Pedidos</button>
    <button role="tab" id="tab-clientes" data-view="clientes" aria-controls="view">Clientes</button>
    <button role="tab" id="tab-usuarios" data-view="usuarios" aria-controls="view">Usuarios</button>
    <button role="tab" id="tab-productos" data-view="productos" aria-controls="view">Productos</button>
    <button role="tab" id="tab-categorias" data-view="categorias" aria-controls="view">Categorías</button>
    <button role="tab" id="tab-inventario" data-view="inventario" aria-controls="view">Inventario</button>
    <button role="tab" id="tab-ajustes" data-view="ajustes" aria-controls="view">Ajustes</button>
  </nav>
</header>

<main>
  <section id="loginView" class="login" hidden aria-labelledby="loginTitle">
    <form id="loginForm" class="card loginCard" novalidate>
      <svg class="loginMark" viewBox="0 0 32 30" aria-hidden="true"><path d="M2 27 10 3h21l-2 6H15l-1 4h12l-2 6H12l-3 8z" fill="currentColor"/></svg>
      <h1 id="loginTitle">Modo Admin</h1>
      <p class="muted" id="loginHint">Inicia sesión con tu cuenta de administrador.</p>
      <label class="field"><span>Correo electrónico</span><input name="email" type="email" autocomplete="username" required maxlength="254"></label>
      <label class="field"><span>Contraseña</span><input name="password" type="password" autocomplete="current-password" required maxlength="256"></label>
      <p class="formError" id="loginError" role="alert"></p>
      <button class="btn primary wide" type="submit">Iniciar sesión</button>
      <a class="loginForgot" href="/#recuperar">¿Olvidaste tu contraseña?</a>
    </form>
  </section>
  <section id="view" class="view" role="tabpanel" tabindex="-1" hidden></section>
</main>

<dialog id="modal" class="sheet" aria-labelledby="modalTitle"><div id="modalBody"></div></dialog>
<dialog id="confirm" class="sheet small" aria-labelledby="confirmTitle">
  <h2 id="confirmTitle"></h2>
  <p id="confirmText" class="muted"></p>
  <div class="sheetActions"><button class="btn secondary" type="button" data-confirm="no">Cancelar</button><button class="btn danger" type="button" data-confirm="yes" id="confirmYes"></button></div>
</dialog>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
