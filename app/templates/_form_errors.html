{% if form.errors %}
<div class="form-error-summary" role="alert" tabindex="-1">
    <strong>Revisa los siguientes campos:</strong><ul>
    {% for field_name, errors in form.errors.items() %}
        {% for error in errors %}<li>{{ form[field_name].label.text }}: {{ error }}</li>{% endfor %}
    {% endfor %}
    </ul>
</div>
{% endif %}
