{% extends 'base.html' %}

{% block title %}Acceso Restringido — Error 403{% endblock %}

{% block content %}
<div class="container" style="max-width: 600px; margin: 60px auto; text-align: center;">
    <div style="background: white; border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 50px 30px;">
        <span style="font-size: 4rem; display: block; margin-bottom: 12px;">🚫</span>
        <h1 style="font-size: 2.2rem; font-weight: 800; margin: 0 0 10px;">Acceso Denegado</h1>
        <p style="color: var(--muted); font-size: 1rem; margin-bottom: 24px;">
            No tienes los permisos requeridos para acceder a esta sección protegida.
        </p>
        <a href="{{ url_for('public.home') }}" class="btn btn-primary">Volver al Inicio</a>
    </div>
</div>
{% endblock %}
